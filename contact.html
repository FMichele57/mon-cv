<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - FOJUD Michèle</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header identique à la page accueil -->
    <header>
      <div class="header-left">
        <div class="avatar">
          <img src="M.png" alt="Michèle FOJUD">
        </div>
      </div>
      <div class="header-right">
        <h1>FOJUD Michèle</h1>
        <p class="title">Assistante administrative et comptable</p>
      </div>
    </header>

    <!-- Menu dynamique -->
    <nav class="menu">
      <a href="index.html#about">À propos</a>
      <a href="index.html#experience">Expériences</a>
      <a href="index.html#education">Formations</a>
      <a href="index.html#skills">Compétences</a>
      <a href="contact.html">Contact</a>
    </nav>

    <main>
      <section id="contact-form">
        <h2>Contactez-moi</h2>
        <form action="https://formspree.io/f/xxxxx" method="POST">
          <label for="name">Nom :</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email :</label>
          <input type="email" id="email" name="_replyto" required>

          <label for="message">Message :</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button type="submit">Envoyer</button>
        </form>
      </section>
    </main>

    <footer>
      <p>© 2025 FOJUD Michèle — CV en ligne</p>
    </footer>
  </div>

  <!-- Bouton retour en haut -->
  <a href="#" class="back-to-top" id="backToTop">↑</a>

  <script>
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      backToTop.style.display = window.scrollY > 300 ? 'block' : 'none';
    });
  </script>
</body>
</html>
